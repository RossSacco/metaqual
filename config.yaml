# config.yaml

dataset:
  name: "msmarco_passage"
  topics_variant: "dev.small"                 # o "test", a seconda del dataset
  qrels_variant: "dev.small"
  

# Parametri Generali dell'Esperimento
experiment:
  scorer: "finetuned_qualt5"       # Opzioni: qualt5, finetuned_qualt5, tasb, perplexity, itn, cdd, all
  threshold: 0.30         # Valore di pruning (es. 0.1 = 10%)
  restart_cache: false   # Se true, ignora i checkpoint e ricalcola tutto
  retriever: "all"    # Opzioni: "bm25", "splade", "tasb", o "all"

# Percorsi di Output
paths:
  cache_dir: "/data/data-sacco/cache"
  indexes_dir: "/data/data-sacco/indexes"
  results_dir: "./results2"
  runs_dir: "/data/data-sacco/runs"  # Naming pruned: runs_{retriever}_{scorer}_{qrels_variant}_{threshold}
                                    # es. runs_all_cdd_dev.small_0.15
  full_runs_dir: "/data/data-sacco/runs/runs_full_msmarco_all"

# Config opzionale per scorer specifici
scorers:
  finetuned_qualt5:
    model_name_or_path: "/home/sacco/metaqual/outputs/qt5-supervised-t5-base/checkpoint-10000"
    batch_size: 32
    max_length: 256
    device: "cuda"
    

# Parametri Avanzati (Opzionali, per tweaking)
advanced:
  chunk_size: 100000
  batch_size: 32
